  <text x="860" y="380" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#54565A">Submit to park</text>
  <text x="860" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#54565A">the concept</text>
  <rect y="558" width="1200" height="72" fill="#000"/>
  <text x="64" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C8C8C8">Lock the idea, then build.</text>
