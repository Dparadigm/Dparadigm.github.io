  <text x="420" y="68" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#AAC27F">Growth</text>
  <text x="520" y="68" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C8C8C8">|</text>
