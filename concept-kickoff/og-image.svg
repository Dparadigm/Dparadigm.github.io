  <text x="64" y="290" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#000">Concept kickoff</text>
  <text x="64" y="360" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#54565A">Park a clear AI concept with your group.</text>
  <text x="64" y="405" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#54565A">Problem, who benefits, what done looks like,</text>
  <text x="64" y="450" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#54565A">and a first milestone.</text>
  <rect x="820" y="170" width="316" height="300" rx="24" fill="#fff" stroke="#C8C8C8" stroke-width="2"/>
