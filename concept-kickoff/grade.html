<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept kickoff received</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --color-brand-primary:#73a950;
  --color-brand-growth:#AAC27F;
  --color-brand-income:#65B2E8;
  --color-brand-legacy:#DAA900;
  --color-brand-gray-3:#C8C8C8;
  --color-ink:#231f20;
  --color-text-body:#515867;
  --color-surface-shell:#fafafa;
  --color-surface-card:#fff;
  --color-success-surface:#f3faf2;
  --color-success-border:#92c575;
  --color-border-default:#e2e2e2;
  --font-family-display:"Montserrat","Gotham",sans-serif;
  --font-family-secondary:"Open Sans","Helvetica Neue",Arial,sans-serif;
  --radius-xl:12px;
  --shadow-card:0 4px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{margin:0; background:var(--color-surface-shell); color:var(--color-ink); font-family:var(--font-family-secondary); line-height:1.5}
.top{background:var(--color-surface-card); padding:16px 20px; border-bottom:1px solid var(--color-border-default)}
.top-inner{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.shield-mark{height:36px;width:auto}
.wordmark{font-family:var(--font-family-display); font-weight:700; font-size:13px; letter-spacing:.18em; text-transform:uppercase}
.stages{margin-top:6px; font-family:var(--font-family-display); font-weight:500; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--color-brand-gray-3)}
.stages .g{color:var(--color-brand-growth)} .stages .i{color:var(--color-brand-income)} .stages .l{color:var(--color-brand-legacy)}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px 72px}
.card{border:1px solid var(--color-success-border); background:var(--color-success-surface); padding:24px 22px; border-radius:var(--radius-xl); box-shadow:var(--shadow-card)}
.lbl{font-family:var(--font-family-display); font-weight:600; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--color-brand-primary); margin-bottom:8px}
h1{font-family:var(--font-family-display); font-weight:700; font-size:28px; margin:0 0 10px}
p{margin:0; color:var(--color-text-body)}
a{color:var(--color-brand-primary); font-weight:600}
</style>
</head>
<body>
<div class="top"><div class="top-inner"><div class="brand">
  <img class="shield-mark" src="shield-mark.svg" alt="" />
  <div>
    <div class="wordmark">Paradigm Life®</div>
    <div class="stages"><span class="g">Growth</span> &nbsp;|&nbsp; <span class="i">Income</span> &nbsp;|&nbsp; <span class="l">Legacy</span></div>
  </div>
</div></div></div>
<div class="wrap">
  <div class="card">
    <div class="lbl">Concept kickoff</div>
    <h1>Concept received</h1>
    <p>Your idea is parked for follow-up. Head back to the <a href="index.html">concept board</a> if you need to submit another.</p>
  </div>
</div>
</body>
</html>
