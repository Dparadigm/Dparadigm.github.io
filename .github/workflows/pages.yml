# Disabled: this repo publishes GitHub Pages via Deploy from a branch (main / root).
# Keeping an Actions deploy-pages workflow concurrent with branch deploys causes
# "Failed to create deployment (status: 400) ... in progress deployment" and stalls the live site.
# Use workflow_dispatch only if you intentionally switch Settings → Pages → Source to GitHub Actions.
name: Deploy GitHub Pages (disabled)

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Branch-based Pages is the active publisher. Switch Settings to GitHub Actions before enabling deploy-pages."
